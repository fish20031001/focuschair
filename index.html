<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf3e6">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="專注椅子">
  <meta name="description" content="小惡魔陪你專注的番茄鐘">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/room.css">
  <link rel="stylesheet" href="css/tabs.css">
  <title>專注椅子</title>
</head>
<body>
  <div id="blocked" class="blocked" hidden>
    <img src="assets/character_sad.png" alt="" width="120">
    <h1>請更新 iOS / 瀏覽器後再使用</h1>
    <p>這個 app 需要較新的瀏覽器功能（Web Locks）來安全地保存資料。請更新到 iOS 16.4 以上的 Safari。</p>
  </div>

  <main id="app">
    <section id="tab-focus" class="tab" aria-label="專注"></section>
    <section id="tab-todo" class="tab" aria-label="待辦" hidden></section>
    <section id="tab-records" class="tab" aria-label="紀錄" hidden></section>
    <section id="tab-shop" class="tab" aria-label="商店" hidden></section>
  </main>

  <nav class="tabbar" aria-label="分頁">
    <button type="button" data-tab="focus" aria-current="page"><span data-icon="timer"></span>專注</button>
    <button type="button" data-tab="todo"><span data-icon="checklist"></span>待辦</button>
    <button type="button" data-tab="records"><span data-icon="chart"></span>紀錄</button>
    <button type="button" data-tab="shop"><span data-icon="bag"></span>商店</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
